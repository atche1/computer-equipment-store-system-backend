spring.application.name=computer-equipment-store-system-api

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/computer-equipment-store-system?autoreconnect=true&createDatabaseIfNotExist=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=8080
# upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ???? ?? ?? ????? ????????? (???? ? ???????????)
app.upload.dir=uploads
